name: Refresh rail timetable

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/refresh-rail.yml"

permissions:
  contents: write

concurrency:
  group: rail-timetable
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Update timetable from TFI
        run: node scripts/update-rail.mjs
      - name: Verify timetable
        run: node --test rail.test.mjs
      - name: Publish updated timetable
        run: |
          if git diff --quiet -- rail.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rail.json
          git commit -m "Refresh TFI rail timetable"
          git push origin HEAD:main

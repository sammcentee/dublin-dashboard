<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Dublin Dashboard</title>
  <desc id="description">A navy banner with a golden sun, green and red tram lines, and the words Weather, daylight and the next way home.</desc>
  <defs>
